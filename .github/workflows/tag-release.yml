# Cut a vX.Y.Z tag on every push to main so the Release workflow can publish a
# GitHub Release with the Chrome zip.
#
# This job pushes tags only, never commits: main is protected. The package.json
# version is only the base version. When its tag does not exist yet (a pull
# request raised it), that version is released. Otherwise the patch number of
# the latest tag is bumped.
#
# A GITHUB_TOKEN tag push does not start other workflows (GitHub recursion
# guard). After pushing the tag this job dispatches release.yml itself. Keep
# `on.workflow_dispatch` on release.yml.
name: tag-release

on:
  push:
    branches: [main]

concurrency:
  group: tag-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag and dispatch Release
        run: |
          set -euo pipefail
          git fetch --tags origin

          if exact=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            if [[ "$exact" == v* ]]; then
              echo "skip: HEAD is already tagged $exact"
              exit 0
            fi
          fi

          pkg=$(node -p "require('./package.json').version")
          if [[ -z "$pkg" ]]; then
            echo "could not read package.json version" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v${pkg}" >/dev/null; then
            latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            IFS=. read -r major minor patch <<<"${latest#v}"
            version="${major}.${minor}.$((patch + 1))"
          else
            version="$pkg"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "v${version}" -m "v${version}"
          git push origin "v${version}"
          gh workflow run release.yml --ref "v${version}"
